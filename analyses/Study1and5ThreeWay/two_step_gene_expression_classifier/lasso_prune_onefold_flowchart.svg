<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="2200" viewBox="0 0 1500 2200">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#444"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #111; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #555; }
      .box { fill: #f7f7f7; stroke: #333; stroke-width: 2; rx: 14; ry: 14; }
      .input { fill: #eef5ff; stroke: #2f5f98; stroke-width: 2; rx: 14; ry: 14; }
      .process { fill: #f6f3ff; stroke: #6650a4; stroke-width: 2; rx: 14; ry: 14; }
      .stats { fill: #fff4df; stroke: #9a6a16; stroke-width: 2; rx: 14; ry: 14; }
      .select { fill: #eef8ee; stroke: #3d7a3d; stroke-width: 2; rx: 14; ry: 14; }
      .output { fill: #fff0f0; stroke: #a44; stroke-width: 2; rx: 14; ry: 14; }
      .diag { fill: #f3f3f3; stroke: #777; stroke-width: 2; rx: 14; ry: 14; stroke-dasharray: 8 6; }
      .label { font: 700 21px Arial, sans-serif; fill: #111; text-anchor: middle; }
      .text { font: 400 17px Arial, sans-serif; fill: #222; text-anchor: middle; }
      .small { font: 400 15px Arial, sans-serif; fill: #444; text-anchor: middle; }
      .note { font: italic 15px Arial, sans-serif; fill: #555; text-anchor: middle; }
      .arrow { stroke: #444; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .branch { stroke: #666; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="750" y="48" class="title" text-anchor="middle">lasso_prune_onefold.py — Flowchart</text>
  <text x="750" y="78" class="subtitle" text-anchor="middle">Single-fold LOSO panel selection: candidate genes → stability selection → pruning → evaluation → final refit</text>

  <!-- inputs -->
  <rect x="350" y="110" width="800" height="120" class="input"/>
  <text x="750" y="145" class="label">Inputs / CLI</text>
  <text x="750" y="176" class="text">counts matrix + metadata + candidate panel gene list</text>
  <text x="750" y="203" class="text">output directory + random seed + holdout_batch</text>

  <path d="M750 230 L750 275" class="arrow"/>

  <!-- load and align -->
  <rect x="305" y="275" width="890" height="155" class="process"/>
  <text x="750" y="310" class="label">Load and align data</text>
  <text x="750" y="341" class="text">Read counts, transpose to samples × genes</text>
  <text x="750" y="369" class="text">Read metadata, lower-case columns, index by sample</text>
  <text x="750" y="397" class="text">Read candidate genes; keep only genes present in count matrix</text>

  <path d="M750 430 L750 475" class="arrow"/>

  <!-- build X y batch -->
  <rect x="360" y="475" width="780" height="125" class="process"/>
  <text x="750" y="510" class="label">Construct modeling objects</text>
  <text x="750" y="542" class="text">X_df = expression of candidate genes</text>
  <text x="750" y="570" class="text">y = tolerant/sensitive labels; batch = batch labels</text>

  <path d="M750 600 L750 645" class="arrow"/>

  <!-- split -->
  <rect x="330" y="645" width="840" height="130" class="process"/>
  <text x="750" y="680" class="label">Split by held-out batch</text>
  <text x="750" y="712" class="text">Training set: samples where batch ≠ holdout_batch</text>
  <text x="750" y="740" class="text">Test set: samples where batch = holdout_batch</text>

  <path d="M750 775 L750 820" class="arrow"/>

  <!-- nested feature selection -->
  <rect x="250" y="820" width="1000" height="320" class="stats"/>
  <text x="750" y="858" class="label">Stability selection on training data</text>
  <text x="750" y="892" class="text">Create composite strata = batch + class label</text>
  <text x="750" y="920" class="text">StratifiedShuffleSplit on training data</text>
  <text x="750" y="948" class="text">Default: 300 resamples, train_size = 0.7</text>
  <text x="750" y="982" class="text">For each resample:</text>
  <text x="750" y="1010" class="small">1. Standardize predictors on resampled subset</text>
  <text x="750" y="1036" class="small">2. Fit balanced logistic regression with saga solver</text>
  <text x="750" y="1062" class="small">3. Penalization: elastic net by default (C = 0.5, l1_ratio = 0.3)</text>
  <text x="750" y="1088" class="small">4. Count genes with |coefficient| &gt; 1e-4 as selected</text>
  <text x="750" y="1116" class="text">Output ranking by selection probability, then mean |coef| when selected</text>

  <!-- path d="M750 1140 L750 1185" class="arrow"/ -->

  <!-- output stab -->
  <rect x="85" y="1185" width="460" height="95" class="output"/>
  <text x="315" y="1220" class="label">Save stability table</text>
  <text x="315" y="1249" class="text">stability_selection_[holdout].csv</text>

  <!-- next ordered genes -->
  <rect x="620" y="1180" width="570" height="105" class="select"/>
  <text x="905" y="1216" class="label">Create ordered gene list</text>
  <text x="905" y="1246" class="text">ordered_genes = stability-ranked genes</text>

  <path d="M750 1140 L315 1185" class="branch"/>
  <path d="M750 1140 L905 1180" class="branch"/>

  <!-- panel-size loop -->
  <rect x="220" y="1330" width="1060" height="460" class="select"/>
  <text x="750" y="1366" class="label">Loop over target panel sizes</text>
  <text x="750" y="1398" class="text">TARGET_SIZES = [6, 8, 10, 12, 16, 24]</text>
  <text x="750" y="1432" class="text">For each m:</text>
  <text x="750" y="1460" class="small">1. topm = first max(2m, m) genes from ordered_genes</text>
  <text x="750" y="1486" class="small">2. Redundancy prune on training set using |correlation| &gt; 0.9</text>
  <text x="750" y="1512" class="small">3. Keep first m genes after pruning</text>
  <text x="750" y="1546" class="text">Evaluate this panel on the fold:</text>
  <text x="750" y="1574" class="small">• Standardize using training data</text>
  <text x="750" y="1600" class="small">• Fit unpenalized logistic regression on training set</text>
  <text x="750" y="1626" class="small">• Calibrate probabilities with sigmoid calibration</text>
  <text x="750" y="1652" class="small">• CV folds = min(5, max(2, smallest class count in training set))</text>
  <text x="750" y="1680" class="text">Compute test-set metrics: AUROC, AUPR, Brier score</text>
  <text x="750" y="1710" class="text">Save selected genes for each m and collect per-size metrics</text>

  <path d="M905 1285 L905 1330" class="arrow"/>

  <!-- loop outputs -->
  <rect x="75" y="1820" width="470" height="95" class="output"/>
  <text x="310" y="1855" class="label">Per-size gene lists</text>
  <text x="310" y="1884" class="text">selected_genes_[holdout]_m[m].txt</text>

  <rect x="655" y="1820" width="420" height="95" class="output"/>
  <text x="865" y="1855" class="label">Per-size metrics</text>
  <text x="865" y="1884" class="text">panel_size_metrics_[holdout].csv</text>

  <path d="M470 1790 L310 1820" class="branch"/>
  <path d="M890 1790 L865 1820" class="branch"/>

  <!-- best size -->
  <rect x="1085" y="1810" width="330" height="115" class="select"/>
  <text x="1250" y="1846" class="label">Choose best panel size</text>
  <text x="1250" y="1875" class="small">best = max AUROC across m</text>
  <text x="1250" y="1903" class="small">Reload best gene list</text>

  <path d="M1120 1790 L1250 1810" class="branch"/>

  <!-- final refit -->
  <rect x="255" y="1970" width="990" height="165" class="stats"/>
  <text x="750" y="2006" class="label">Final refit using best panel size</text>
  <text x="750" y="2038" class="text">Standardize training and test data using best_genes</text>
  <text x="750" y="2066" class="text">Fit unpenalized logistic regression + sigmoid calibration on training set</text>
  <text x="750" y="2094" class="text">Extract coefficients / intercept and generate test-set predicted probabilities</text>

  <path d="M1250 1925 L1030 1970" class="branch"/>

  <!-- final outputs -->
  <rect x="40" y="2160" width="340" height="32" fill="none"/>
  <rect x="40" y="2145" width="340" height="45" class="output"/>
  <text x="210" y="2173" class="small">coefficients_[holdout].csv</text>

  <rect x="410" y="2145" width="320" height="45" class="output"/>
  <text x="570" y="2173" class="small">preds_[holdout].csv</text>

  <rect x="760" y="2145" width="420" height="45" class="output"/>
  <text x="970" y="2173" class="small">best_panel_summary_[holdout].json</text>

  <rect x="1210" y="2145" width="250" height="45" class="diag"/>
  <text x="1335" y="2172" class="small">results saved to outdir</text>

  <path d="M520 2135 L210 2145" class="branch"/>
  <path d="M680 2135 L570 2145" class="branch"/>
  <path d="M840 2135 L970 2145" class="branch"/>
  <path d="M1000 2135 L1335 2145" class="branch"/>

  <!-- optional disabled section -->
  <rect x="1185" y="470" width="255" height="135" class="diag"/>
  <text x="1312" y="505" class="label">Disabled option</text>
  <text x="1312" y="538" class="small">Optional batch-wise mean-centering</text>
  <text x="1312" y="565" class="small">for removing additive batch offsets</text>
  <text x="1312" y="592" class="small">currently inside if False block</text>
</svg>
